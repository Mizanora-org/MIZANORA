# Mizanora v54 — keep data/imdb-ids.txt fresh from IMDb's own dataset.
#
# Every week this downloads https://datasets.imdbws.com/title.basics.tsv.gz, keeps the newest
# 500,000 films + series and commits the id list. /sitemaps/movies-*.xml and /sitemaps/series-*.xml
# build themselves from that file, so the sitemap index grows to cover the whole catalogue without
# any server doing the crawl.
#
# Run it by hand any time: Actions → imdb-ids → Run workflow.
name: imdb-ids

on:
  schedule:
    - cron: '17 3 * * 1' # every Monday, 03:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many ids to keep'
        required: false
        default: '500000'
      min-year:
        description: 'Oldest year to include (blank = no limit)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: imdb-ids
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the id list
        env:
          LIMIT: ${{ github.event.inputs.limit || '500000' }}
          MIN_YEAR: ${{ github.event.inputs.min-year || '' }}
        run: |
          node scripts/build-imdb-ids.mjs --limit "$LIMIT" ${MIN_YEAR:+--min-year "$MIN_YEAR"}

      - name: Report size
        run: |
          wc -l data/imdb-ids.txt
          du -h data/imdb-ids.txt

      - name: Commit when it changed
        run: |
          git config user.name "mizanora-bot"
          git config user.email "bot@mizanora.vercel.app"
          if git diff --quiet -- data/imdb-ids.txt; then
            echo "No change — sitemap already current."
            exit 0
          fi
          git add data/imdb-ids.txt
          git commit -m "chore(imdb): refresh the sitemap id list ($(date -u +%Y-%m-%d)) [skip vercel]"
          # v61: [skip vercel] — a weekly data-only change must NOT trigger a deployment.
          # A push rebuilds all prerendered pages, i.e. one ISR write per page at build time plus the
          # origin transfer of every page; that was part of the 620K ISR writes / 23.9 GB origin
          # transfer that paused the project (2026-11-09). The sitemaps read this file at request time,
          # so the fresh list is live without a rebuild.
          git push
