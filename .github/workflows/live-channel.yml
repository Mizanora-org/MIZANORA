# Live Channel (Quran & Hadith on YouTube) - v27.1 - 24/7 BATON
#
# This action keeps Mizanora's Quran & Hadith channel alive 24/7. How the timing works (master level):
#
#   * ONE run pushes to YouTube for up to ~5.5 hours with ONE ffmpeg process and ONE playlist - inside a run the
#     stream NEVER restarts (not for a second).
#   * ~20 minutes before a run ends, scripts/live-cast.mjs dispatches the NEXT run ("baton"). The concurrency group
#     below queues that run so it starts the MOMENT this one ends - a handover of about a minute (runner boot).
#   * The cron runs every 30 minutes as a safety net: a fresh pending run always exists (the newest pending replaces
#     the old one), so even if the baton dies the handover still happens. If everything is already running, the new
#     run just queues and continues afterwards - the channel does not care.
#   * Inside a run the program is computed from the wall clock, so even after ANY reconnect/queue delay the stream
#     continues with exactly the same ayah / hadith / ad a viewer of the website hears at that second.
#
# For a LITERALLY gapless 24/7 stream (zero handovers), run the caster on your own PC / VPS instead:
#   npm run cast:live -- --loop          (one endless process; reconnect only on real failures)
# GitHub-hosted runners cap a job at 6 hours, so a twice-a-day handover there is by design.
#
# Secrets (repo -> Settings -> Secrets and variables -> Actions):
#   CAST_TOKEN           (optional) same secret as Vercel CAST_TOKEN, loads the private key from the admin panel
#   YOUTUBE_STREAM_KEY   (alternative) the stream key from Admin > Live Channel > YouTube
#   LIVE_CHANNEL_API     (optional) the site origin, default https://mizanora.vercel.app
#
# Run it by hand: Actions tab -> "Live Channel (Quran & Hadith on YouTube)" -> Run workflow
#   duration   one-shot budget in minutes (1-350, default 330 = 5.5 h)
#   dry_run    only build the playlist (safe test, nothing is sent to YouTube)
#   force      go live even outside the schedule windows
#   no_chain   do not dispatch the next run (single-shot test)

name: Live Channel (Quran & Hadith on YouTube)

run-name: Live channel 24/7 — ${{ github.event.inputs.duration || 330 }} min push

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'One push budget in minutes (1-350)'
        required: false
        default: '330'
      dry_run:
        description: 'Only build the playlist (no YouTube)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Go live even when the channel is off air'
        type: boolean
        required: false
        default: false
      no_chain:
        description: 'Do not dispatch the next run (single shot)'
        type: boolean
        required: false
        default: false
  schedule:
    # Every 30 minutes: the "safety-net baton". A new run never interrupts a running one (concurrency queues it);
    # it only guarantees a fresh run is always waiting to take over. Runs off-schedule exit by themselves.
    - cron: '*/30 * * * *'

permissions:
  contents: read
  actions: write   # the caster dispatches the next run (the baton)

# One encoder at a time on the whole channel. A new run WAITS here and starts the second the running one ends.
concurrency:
  group: live-channel
  cancel-in-progress: false

jobs:
  cast:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # hard GitHub limit is 360; the caster's own budget ends earlier and sends the baton
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Push the channel to YouTube (Quran tilawat + hadees + ads)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          CAST_TOKEN: ${{ secrets.CAST_TOKEN }}
          LIVE_CHANNEL_API: ${{ secrets.LIVE_CHANNEL_API }}
          CAST_MINUTES: ${{ github.event.inputs.duration || '330' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${{ github.event.inputs.no_chain }}" = "true" ]; then FLAGS="$FLAGS --no-chain"; fi
          node scripts/live-cast.mjs $FLAGS
