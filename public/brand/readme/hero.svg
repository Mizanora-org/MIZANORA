yle="animation-delay:1.200s" fill="#F6F1E4">a</text><text class="ch" x="394.2" y="182" style="animation-delay:1.260s" fill="#F6F1E4">l</text><text class="ch" x="404.4" y="182" style="animation-delay:1.320s" fill="#F6F1E4">.</text><text class="ch" x="414.6" y="182" style="animation-delay:1.380s" fill="#F6F1E4"> </text><text class="ch" x="424.8" y="182" style="animation-delay:1.440s" fill="#F6F1E4">C</text><text class="ch" x="435.0" y="182" style="animation-delay:1.500s" fill="#F6F1E4">a</text><text class="ch" x="445.2" y="182" style="animation-delay:1.560s" fill="#F6F1E4">s</text><text class="ch" x="455.4" y="182" style="animation-delay:1.620s" fill="#F6F1E4">h</text><text class="ch" x="465.6" y="182" style="animation-delay:1.680s" fill="#F6F1E4"> </text><text class="ch" x="475.8" y="182" style="animation-delay:1.740s" fill="#F6F1E4">o</text><text class="ch" x="486.0" y="182" style="animation-delay:1.800s" fill="#F6F1E4">n</text><text class="ch" x="496.2" y="182" style="animation-delay:1.860s" fill="#F6F1E4"> </text><text class="ch" x="506.4" y="182" style="animation-delay:1.920s" fill="#F6F1E4">d</text><text class="ch" x="516.6" y="182" style="animation-delay:1.980s" fill="#F6F1E4">e</text><text class="ch" x="526.8" y="182" style="animation-delay:2.040s" fill="#F6F1E4">l</text><text class="ch" x="537.0" y="182" style="animation-delay:2.100s" fill="#F6F1E4">i</text><text class="ch" x="547.2" y="182" style="animation-delay:2.160s" fill="#F6F1E4">v</text><text class="ch" x="557.4" y="182" style="animation-delay:2.220s" fill="#F6F1E4">e</text><text class="ch" x="567.6" y="182" style="animation-delay:2.280s" fill="#F6F1E4">r</text><text class="ch" x="577.8" y="182" style="animation-delay:2.340s" fill="#F6F1E4">y</text><text class="ch" x="588.0" y="182" style="animation-delay:2.400s" fill="#F6F1E4">.</text><rect class="caret" x="600.2" y="168.74" width="2.0" height="16.1" fill="#F2C766" rx="1"/></g>

