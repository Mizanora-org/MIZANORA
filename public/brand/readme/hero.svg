      <text x="381.5" y="224.5" text-anchor="middle" fill="#F2C766">NEXT.JS 15</text><rect x="442" y="208" width="141" height="25" rx="12.5" fill="#0A3D2A" stroke="#F2C766" stroke-opacity="0.38"/>
      <text x="512.5" y="224.5" text-anchor="middle" fill="#F2C766">KASUR · PAKISTAN</text>
  </g>

