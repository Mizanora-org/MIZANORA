  <g class="spin-rev"><circle cx="60" cy="60" r="50" fill="none" stroke="#34D399" stroke-opacity=".28" stroke-dasharray="22 12" stroke-width="1.4"/></g>
  <rect x="20" y="20" width="80" height="80" rx="24" fill="url(#hero-tile)" stroke="url(#hero-gold)" stroke-opacity=".55" stroke-width="1.4"/>
  <g mask="url(#hero-cut)"><circle cx="60" cy="60" r="34" fill="url(#hero-gold)"/></g>
  <path d="M84 34l1.9 5.6 5.6 1.9-5.6 1.9L84 49l-1.9-5.6L76.5 41.5l5.6-1.9z" fill="url(#hero-gold)"/>
