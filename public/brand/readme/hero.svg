    <text x="180" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" letter-spacing="3.4" fill="#34D399" opacity=".9">QURAN · HADITH · LIVE TV · REELS · TOOLS</text>
  </g>

