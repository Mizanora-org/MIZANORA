      <text x="892" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#F2C766" opacity=".9">Al-Baqarah 2:255</text>
      <rect class="bar" x="874" y="242" width="6" height="10" rx="3" fill="#F2C766" opacity=".9" style="animation-delay:0.00s"/><rect class="bar" x="885" y="235" width="6" height="17" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.09s"/><rect class="bar" x="896" y="228" width="6" height="24" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.18s"/><rect class="bar" x="907" y="221" width="6" height="31" rx="3" fill="#F2C766" opacity=".9" style="animation-delay:0.27s"/><rect class="bar" x="918" y="214" width="6" height="38" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.36s"/><rect class="bar" x="929" y="237" width="6" height="15" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.45s"/><rect class="bar" x="940" y="230" width="6" height="22" rx="3" fill="#F2C766" opacity=".9" style="animation-delay:0.54s"/><rect class="bar" x="951" y="223" width="6" height="29" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.63s"/><rect class="bar" x="962" y="216" width="6" height="36" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.72s"/><rect class="bar" x="973" y="239" width="6" height="13" rx="3" fill="#F2C766" opacity=".9" style="animation-delay:0.81s"/><rect class="bar" x="984" y="232" width="6" height="20" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.90s"/><rect class="bar" x="995" y="225" width="6" height="27" rx="3" fill="#34D399" opacity=".9" style="animation-delay:0.99s"/><rect class="bar" x="1006" y="218" width="6" height="34" rx="3" fill="#F2C766" opacity=".9" style="animation-delay:1.08s"/><rect class="bar" x="1017" y="241" width="6" height="11" rx="3" fill="#34D399" opacity=".9" style="animation-delay:1.17s"/><rect class="bar" x="1028" y="234" width="6" height="18" rx="3" fill="#34D399" opacity=".9" style="animation-delay:1.26s"/><rect class="bar" x="1039" y="227" width="6" height="25" rx="3" fill="#F2C766" opacity=".9" style="animation-delay:1.35s"/><rect class="bar" x="1050" y="220" wid