<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="stTitle">
<title id="stTitle">By the numbers — public repositories, stars, Mizanora products, live channels, free tools and shipped projects</title>
<defs>
  <linearGradient id="stg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3FBF7"/><stop offset="1" stop-color="#E2F3EA"/></linearGradient>
  <pattern id="stdots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#12A06B" fill-opacity="0.12"/></pattern>
  <clipPath id="stclip"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
    .spin-slow{transform-box:fill-box;transform-origin:center;animation:mz-spin 42s linear infinite}
    .spin-fast{transform-box:fill-box;transform-origin:center;animation:mz-spin 24s linear infinite reverse}
    .spin-mid{transform-box:fill-box;transform-origin:center;animation:mz-spin 33s linear infinite}
    @keyframes mz-spin{to{transform:rotate(360deg)}}
    .glow{transform-box:fill-box;transform-origin:center;animation:mz-glow 5.5s ease-in-out infinite}
    @keyframes mz-glow{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
    .live-dot{transform-box:fill-box;transform-origin:center;animation:mz-live 1.5s ease-in-out infinite}
    @keyframes mz-live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}
    .ring{transform-box:fill-box;transform-origin:center;animation:mz-ring 2.4s ease-out infinite}
    @keyframes mz-ring{0%{opacity:.6;transform:scale(.5)}100%{opacity:0;transform:scale(2.1)}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:mz-bar 1.2s ease-in-out infinite}
    @keyframes mz-bar{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:mz-twinkle 3s ease-in-out infinite}
    @keyframes mz-twinkle{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    .float{animation:mz-float 9s ease-in-out infinite}
    @keyframes mz-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .scan{animation:mz-scan 5s linear infinite}
    @keyframes mz-scan{0%{transform:translateY(0);opacity:0}10%{opacity:.45}85%{opacity:.45}100%{transform:translateY(150px);opacity:0}}
    .sheen{animation:mz-sheen 6.5s ease-in-out infinite}
    @keyframes mz-sheen{0%,58%{transform:translateX(-420px)}100%{transform:translateX(720px)}}
    .tape{animation:mz-tape linear infinite}
    .tape-l{animation-direction:normal}
    .ch{opacity:1;animation:mz-ch 12s linear infinite both}
    @keyframes mz-ch{0%{opacity:0}1.2%{opacity:1}96%{opacity:1}99.5%{opacity:0}100%{opacity:0}}
    .caret{animation:mz-caret 1.05s steps(1) infinite}
    @keyframes mz-caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    .fade1{opacity:1;animation:mz-fade 10.5s linear infinite both}
    .fade2,.fade3{opacity:0;animation:mz-fade 10.5s linear infinite both}
    .fade2{animation-delay:3.5s}
    .fade3{animation-delay:7s}
    @keyframes mz-fade{0%{opacity:0;transform:translateY(4px)}3%{opacity:1;transform:none}30%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .pop{opacity:1;animation:mz-pop 9s ease-out infinite both}
    @keyframes mz-pop{0%{opacity:0;transform:translateY(10px) scale(.97)}6%{opacity:1;transform:none}100%{opacity:1;transform:none}}
    .grow{transform-box:fill-box;transform-origin:0 50%;animation:mz-grow 7s ease-in-out infinite}
    @keyframes mz-grow{0%{transform:scaleX(.02)}18%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(.02)}}
    .fill{animation:mz-fill 8s linear infinite}
    @keyframes mz-fill{0%{width:10px}100%{width:340px}}
    .beat{animation:mz-beat 2.6s ease-in-out infinite}
    @keyframes mz-beat{0%,100%{opacity:.35}50%{opacity:.9}}
    @media (prefers-reduced-motion: reduce){
      .spin-slow,.spin-fast,.spin-mid,.glow,.live-dot,.ring,.bar,.twinkle,.float,.scan,.sheen,.tape,
      .ch,.caret,.fade1,.fade2,.fade3,.pop,.grow,.fill,.beat{animation:none!important;transform:none!important}
      .ch,.fade1,.pop{opacity:1}
    }
    
  </style>
<g clip-path="url(#stclip)">
  <rect width="1200" height="300" fill="url(#stg)"/>
  <rect width="1200" height="300" fill="url(#stdots)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle class="live-dot" cx="34" cy="36" r="5" fill="#12A06B"/>
    <text x="50" y="41" font-size="14" font-weight="800" letter-spacing=".4" fill="#0B2A1E">By the numbers</text>
    <text x="1172" y="41" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.2" fill="#5E8A78">UPDATED OCTOBER 2026</text>
  </g>
  <g class="pop" style="animation-delay:0.00s">
      <rect x="28" y="66" width="372" height="96" rx="18" fill="#FFFFFF" stroke="#CFE7DA"/>
      <rect x="28" y="66" width="4" height="96" rx="2" fill="#12A06B" opacity=".8"/>
      <text x="54" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#12A06B" data-k="repos">92</text>
      <text x="54" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5E8A78">PUBLIC REPOS</text>
      <circle class="twinkle" cx="376" cy="90" r="2.2" fill="#12A06B" style="animation-delay:0.00s"/>
    </g><g class="pop" style="animation-delay:0.50s">
      <rect x="418" y="66" width="372" height="96" rx="18" fill="#FFFFFF" stroke="#CFE7DA"/>
      <rect x="418" y="66" width="4" height="96" rx="2" fill="#C08A22" opacity=".8"/>
      <text x="444" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#C08A22" data-k="stars">12</text>
      <text x="444" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5E8A78">STARS EARNED</text>
      <circle class="twinkle" cx="766" cy="90" r="2.2" fill="#C08A22" style="animation-delay:0.30s"/>
    </g><g class="pop" style="animation-delay:1.00s">
      <rect x="808" y="66" width="372" height="96" rx="18" fill="#FFFFFF" stroke="#CFE7DA"/>
      <rect x="808" y="66" width="4" height="96" rx="2" fill="#12A06B" opacity=".8"/>
      <text x="834" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#12A06B" data-k="products">11,000+</text>
      <text x="834" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5E8A78">PRODUCTS IN MIZANORA</text>
      <circle class="twinkle" cx="1156" cy="90" r="2.2" fill="#12A06B" style="animation-delay:0.60s"/>
    </g><g class="pop" style="animation-delay:1.50s">
      <rect x="28" y="180" width="372" height="96" rx="18" fill="#FFFFFF" stroke="#CFE7DA"/>
      <rect x="28" y="180" width="4" height="96" rx="2" fill="#C08A22" opacity=".8"/>
      <text x="54" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#C08A22" data-k="channels">800</text>
      <text x="54" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5E8A78">LIVE TV CHANNELS</text>
      <circle class="twinkle" cx="376" cy="204" r="2.2" fill="#C08A22" style="animation-delay:0.90s"/>
    </g><g class="pop" style="animation-delay:2.00s">
      <rect x="418" y="180" width="372" height="96" rx="18" fill="#FFFFFF" stroke="#CFE7DA"/>
      <rect x="418" y="180" width="4" height="96" rx="2" fill="#12A06B" opacity=".8"/>
      <text x="444" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#12A06B" data-k="tools">38</text>
      <text x="444" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5E8A78">FREE TOOLS</text>
      <circle class="twinkle" cx="766" cy="204" r="2.2" fill="#12A06B" style="animation-delay:1.20s"/>
    </g><g class="pop" style="animation-delay:2.50s">
      <rect x="808" y="180" width="372" height="96" rx="18" fill="#FFFFFF" stroke="#CFE7DA"/>
      <rect x="808" y="180" width="4" height="96" rx="2" fill="#C08A22" opacity=".8"/>
      <text x="834" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#C08A22" data-k="projects">30</text>
      <text x="834" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5E8A78">PROJECTS SHIPPED</text>
      <circle class="twinkle" cx="1156" cy="204" r="2.2" fill="#C08A22" style="animation-delay:1.50s"/>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#CFE7DA"/>
</svg>
