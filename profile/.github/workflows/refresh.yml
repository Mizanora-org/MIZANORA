# Keeps the profile's animated art true: every night it re-reads GitHub (and the
# shop's cached /api/github) and rewrites the numbers inside assets/*.svg.
# The SVG layouts, colours and animations are never touched - only the text at
# the tags marked data-k="repos" ... data-k="updated".
name: refresh live numbers

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC every night (07:17 Pakistan time)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/make-art.mjs'
      - 'scripts/refresh-live.mjs'

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the art (in case the generator changed)
        run: node scripts/make-art.mjs

      - name: Refresh the live numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOP_URL: https://mizanora.vercel.app
        run: node scripts/refresh-live.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "nothing to commit - the numbers are already current"
          else
            git commit -m "chore: refresh live numbers in the profile art"
            git push
          fi
